name: HIF AutoBuild Windows x64

on:
  schedule:
    - cron: '0 20 * * *' # 04:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

# 定时任务只从默认分支触发；构建源码固定取开发分支。
env:
  SOURCE_BRANCH: hif-dev

concurrency:
  group: hif-autobuild
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'miyu1019/MaaGakumasu' && github.ref == 'refs/heads/hif-independent'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - name: Record source commit
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source commit lookup failed' }
          "SOURCE_SHA=$sha" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.9'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build pinned HIF runtime
        run: python tools/hif_build.py build
      - name: Record AutoBuild identity
        run: |
          $path = 'build/MaaGakumasu-HIF/hif-build-info.json'
          $info = Get-Content $path -Raw | ConvertFrom-Json
          $builtAt = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString('yyyy-MM-dd HH:mm:ss zzz')
          $buildIdentity = $env:SOURCE_SHA.Substring(0, 7)
          $info | Add-Member -NotePropertyName build_channel -NotePropertyValue 'autobuild'
          $info | Add-Member -NotePropertyName source_commit -NotePropertyValue $env:SOURCE_SHA
          $info | Add-Member -NotePropertyName built_at -NotePropertyValue $builtAt
          $info | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          "HIF_VERSION=$($info.version)" >> $env:GITHUB_ENV
          "BUILT_AT=$builtAt" >> $env:GITHUB_ENV
          "BUILD_IDENTITY=$buildIdentity" >> $env:GITHUB_ENV
      - name: Verify before packaging
        run: |
          python tools/hif_verify.py
          if ($LASTEXITCODE -ne 0) { throw 'Full verification failed' }
          dotnet tools/PanelQa/bin/Debug/net10.0/PanelQa.dll build/verification-runtime --swap-out-options-only
          if ($LASTEXITCODE -ne 0) { throw 'Swap-out panel verification failed' }
      - name: Package and audit
        run: |
          python tools/hif_build.py package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $package = "dist/MaaGakumasu-HIF-win-x64-$env:HIF_VERSION.zip"
          python tools/hif_audit.py --archive $package
          if ($LASTEXITCODE -ne 0) { throw 'Package audit failed' }
          $name = 'MaaGakumasu-HIF-win-x64-autobuild.zip'
          Move-Item -LiteralPath $package -Destination "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding utf8
      - uses: actions/upload-artifact@v6
        with:
          name: HIF-autobuild-win-x64
          retention-days: 7
          path: |
            dist/*autobuild.zip
            dist/*autobuild.zip.sha256
            build/verification-result.json
            build/audit-result.json
      - name: Update AutoBuild prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 提交标题含中文；按 UTF-8 读取 git 输出。
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          # 本次与上一次测试包之间的提交；autobuild 标签指向上一次构建的源码提交。
          $previous = git rev-parse -q --verify 'refs/tags/autobuild^{commit}'
          if (-not $previous) {
            $changes = git log --no-merges --format='- %s（%h）' -n 10 $env:SOURCE_SHA
          } elseif ($previous -eq $env:SOURCE_SHA) {
            $changes = '- 源码与上一次测试包相同。'
          } else {
            git merge-base --is-ancestor $previous $env:SOURCE_SHA
            $range = if ($LASTEXITCODE -eq 0) { "$previous..$env:SOURCE_SHA" } else { $env:SOURCE_SHA }
            $changes = git log --no-merges --format='- %s（%h）' -n 50 $range
          }
          $changes = ($changes | Out-String).Trim()
          $summary = @"
          - 测试版标识：${env:HIF_VERSION} · AutoBuild · $env:BUILD_IDENTITY
          - 构建时间：$env:BUILT_AT
          - 源码提交：[$env:BUILD_IDENTITY](https://github.com/$env:GITHUB_REPOSITORY/tree/$env:SOURCE_SHA)（$env:SOURCE_BRANCH 分支）

          ## 本次包含的提交

          $changes
          "@
          @"
          # AutoBuild 测试包

          每天北京时间 04:00 自动构建 ``$env:SOURCE_BRANCH`` 分支，固定下载地址保留最新一次构建的 Windows x64 测试包。
          此包是预发布测试构建，不属于新的正式版本；版本号沿用 ${env:HIF_VERSION}，按源码提交区分新旧。

          $summary

          ## 使用方式

          - 已安装 HIF：在「设置 → 版本更新」把更新渠道切到「测试版 (AutoBuild)」后检查并更新，个人配置保留；切回「正式版」可换回同版本号或更新的正式版。
          - 新装：下载 ZIP 与同名 SHA-256 文件，校验后解压到新目录。

          [构建日志](https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)
          "@ | Set-Content build/autobuild-notes.md -Encoding utf8
          # 客户端只从这个文件读取测试包身份和更新说明（tools/hif_update.py 的 describe_autobuild）。
          [ordered]@{
            tag = 'autobuild'; version = $env:HIF_VERSION; commit = $env:SOURCE_SHA; branch = $env:SOURCE_BRANCH
            built_at = $env:BUILT_AT; package = 'MaaGakumasu-HIF-win-x64-autobuild.zip'; notes = $summary
          } | ConvertTo-Json | Set-Content dist/autobuild.json -Encoding utf8
          gh release view autobuild --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create autobuild --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title 'AutoBuild' --notes-file build/autobuild-notes.md --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'AutoBuild release creation failed' }
          }
          gh release upload autobuild dist/MaaGakumasu-HIF-win-x64-autobuild.zip dist/MaaGakumasu-HIF-win-x64-autobuild.zip.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'AutoBuild asset upload failed' }
          # 身份文件在安装包之后上传：两者不一致的短暂窗口内，客户端会因源码提交不符拒绝安装，而不会装错。
          gh release upload autobuild dist/autobuild.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'AutoBuild identity upload failed' }
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/autobuild" -f "sha=$env:SOURCE_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'AutoBuild tag update failed' }
          gh release edit autobuild --repo $env:GITHUB_REPOSITORY --title 'AutoBuild' --notes-file build/autobuild-notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'AutoBuild release update failed' }
