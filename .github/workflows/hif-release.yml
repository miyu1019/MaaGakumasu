name: HIF Windows x64
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the configured HIF version after verification
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9][0-9][0-9].[0-9]*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 构建机自带的 3.12 只运行构建脚本；运行包内置的 Python 仍按 hif-release.json 固定为 3.12.9。
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-hif.txt
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: build/downloads
          key: hif-downloads-${{ hashFiles('hif-release.json') }}
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content hif-release.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^v\d{6}\.\d+$') { throw 'Expected date version vYYMMDD.sequence' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) {
            throw 'Tag does not match hif-release.json'
          }
          "HIF_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build pinned HIF runtime
        run: python tools/hif_build.py build
      - name: Verify before packaging
        run: python tools/hif_verify.py
      - name: Package and checksum
        run: python tools/hif_build.py package
      - uses: actions/upload-artifact@v6
        with:
          name: HIF-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag' || inputs.publish
        with:
          tag_name: ${{ env.HIF_VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.HIF_VERSION }}
          files: |
            dist/*.zip
            dist/*.sha256
          body_path: docs/hif/发布说明.md
